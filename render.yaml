services:
  - type: web
    name: eshopping
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn eshopping.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Admin@12345
      - key: ADMIN_EMAIL
        value: admin@example.com
