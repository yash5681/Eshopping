<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Portal Login | E-Shop</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --brand-green: #1a4331;
            --brand-dark: #121814;
            --brand-lime: #c5ea33;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #102016 0%, #0d1710 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
        }

        .login-header {
            background: #172a1e;
            color: #ffffff;
            padding: 36px 30px 28px;
            text-align: center;
            position: relative;
        }

        .login-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .btn-brand-login {
            background: var(--brand-green);
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-brand-login:hover {
            background: #123023;
            color: #fff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="d-inline-flex align-items-center justify-content-center bg-white bg-opacity-10 rounded-circle mb-3 p-3">
            <i class="bi bi-shield-lock-fill text-warning fs-3"></i>
        </div>
        <div class="login-brand">E-SHOP <span style="color:var(--brand-lime)">.</span> ADMIN</div>
        <p class="text-white-50 small mb-0 mt-1">Authorized Store Staff Access</p>
    </div>

    <div class="p-4 p-sm-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'danger' }} small py-2 px-3 rounded-3 mb-3 d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Staff Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 bg-light" placeholder="Username (e.g. yash)" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 bg-light" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-brand-login w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Admin Panel
            </button>
        </form>

        <div class="text-center mt-3 pt-3 border-top">
            <a href="{% url 'home' %}" class="text-decoration-none small text-muted">
                <i class="bi bi-arrow-left"></i> Return to Public Storefront
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
