{% extends "base.html" %}
{% load static %}

{% block title %}Create Account | E-Shop{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-white text-center border-0 pt-4 pb-2">
                    <a href="{% url 'home' %}" aria-label="EShopping home">
                        <img class="auth-brand-logo mb-2" src="{% static 'shopping/eshopping-logo.svg' %}" alt="EShopping">
                    </a>
                    <h4 class="fw-bold mb-1">Create Account</h4>
                    <p class="text-muted small">Join E-Shop to enjoy seamless purchases</p>
                </div>

                <div class="card-body p-4 pt-2">
                    {% if error %}
                    <div class="alert alert-danger small py-2 px-3 rounded-3 d-flex align-items-center gap-2 mb-3">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}

                    <form method="POST" action="{% url 'register' %}">
                        {% csrf_token %}

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Full Name</label>
                            <input type="text" name="name" class="form-control bg-light" placeholder="Your name" required autofocus>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Email Address</label>
                            <input type="email" name="email" class="form-control bg-light" placeholder="name@example.com" required>
                        </div>

                        <!-- Mobile Number -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Mobile Number</label>
                            <input type="tel" name="mobile" class="form-control bg-light" placeholder="10-digit mobile number" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Password</label>
                            <input type="password" name="password" class="form-control bg-light" placeholder="Create password" required>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control bg-light" placeholder="Re-enter password" required>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-shop py-2 rounded-pill fw-bold">
                                Register Account
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <div class="text-center small">
                        <p class="text-muted mb-2">Already have an account?</p>
                        <a href="{% url 'login' %}" class="btn btn-outline-dark btn-sm rounded-pill px-4">
                            Sign In Here
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
