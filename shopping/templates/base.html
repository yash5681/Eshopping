<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a4331">
    <title>{% block title %}E-Shop | Everyday, well chosen{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --ink: #162018;
            --muted: #647067;
            --paper: #f8f9f6;
            --green: #1a4331;
            --green-hover: #133325;
            --lime: #d2f839;
            --line: #e4e7e1;
            --card-shadow: 0 8px 24px rgba(22, 32, 24, 0.06);
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: "Plus Jakarta Sans", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, .brand-name {
            font-family: "Space Grotesk", sans-serif;
        }

        a { color: inherit; }

        .btn-shop {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-shop:hover, .btn-shop:focus {
            background: var(--green-hover);
            border-color: var(--green-hover);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(26, 67, 49, 0.2);
        }

        .text-shop { color: var(--green); }
        .auth-brand-logo { width: 140px; height: 70px; object-fit: contain; }
        .footer-brand-logo { display: block; width: 120px; height: 60px; object-fit: contain; }

        .toast-container-custom {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1090;
        }

        @media (prefers-reduced-motion: no-preference) {
            .page-arrive { animation: arrive .45s ease-out both; }
            @keyframes arrive {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <!-- Floating Notifications -->
    {% if messages %}
    <div class="toast-container-custom">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-lg border-0 rounded-3 d-flex align-items-center gap-2 mb-2 py-3 px-4" role="alert" style="min-width: 300px;">
            <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill text-success{% elif message.tags == 'error' or message.tags == 'danger' %}bi-exclamation-triangle-fill text-danger{% else %}bi-info-circle-fill text-info{% endif %} fs-5"></i>
            <div>{{ message }}</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <div class="flex-grow-1">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
